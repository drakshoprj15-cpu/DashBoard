name: Sincronizar clientes da Milluni

# Agendamento PAUSADO: o segredo MILLUNI_SYNC_URL aponta para
# www.painelinfinitydash.online, que deixou de resolver no DNS, e todas as
# execuções agendadas falhavam com "Could not resolve host". Nenhuma
# sincronização acontecia — só o erro.
#
# Para reativar (ver docs/MILLUNI.md):
#   1. atualizar o segredo MILLUNI_SYNC_URL para o endereço atual do painel;
#   2. confirmar que CRON_SECRET e as variáveis MILLUNI_* existem no deploy;
#   3. validar com uma execução manual ("Run workflow");
#   4. descomentar o bloco `schedule` abaixo.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: milluni-customers-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar sincronização do Infinity
        env:
          SYNC_URL: ${{ secrets.MILLUNI_SYNC_URL }}
          CRON_SECRET: ${{ secrets.MILLUNI_CRON_SECRET }}
        run: |
          test -n "$SYNC_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL"
